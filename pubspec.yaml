name: trackguard_dhr
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  camera: ^0.12.1
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.1
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  path: ^1.9.1
  sqflite: ^2.4.2
  supabase_flutter: ^2.18.3
  litertlm: ^0.0.14
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  http: ^1.2.0
  video_player: ^2.14.1
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#101426"
  adaptive_icon_foreground: "assets/branding/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/branding/